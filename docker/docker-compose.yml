services:
  server:
    build:
      context: ..
      dockerfile: docker/server.Dockerfile
    env_file:
      - path: ../scr/server/.env
        required: false
    ports:
      - "5000:5000"
    restart: unless-stopped
  web:
    build:
      context: ..
      dockerfile: docker/client.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped
