# Optional local MongoDB. Use together with docker-compose.yml.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
  server:
    environment:
      MONGO_URI: mongodb://mongo:27017/mira_jewelry
    depends_on:
      mongo:
        condition: service_healthy
volumes:
  mongo_data:
